name: Mise à jour AROME-IFS 2,5 km
on:
  workflow_dispatch:
    inputs:
      force:
        description: Reconstruire même si ce calcul est déjà publié
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: update-arome-ifs-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les outils GRIB
        run: python -m pip install -r requirements.txt
      - name: Vérifier le module WordPress
        run: |
          php -l wordpress/arome-ifs-2-5-km/arome-ifs-2-5-km.php
          node --check wordpress/arome-ifs-2-5-km/assets/arome-meteo.js
      - name: Vérifier les calculs météo
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Construire les prévisions Météo-France AROME-IFS
        env:
          FORCE: ${{ inputs.force }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=()
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          python scripts/update_arome_ifs.py --repository "$REPOSITORY" "${args[@]}"
      - name: Vérifier la publication nationale
        id: validate
        run: |
          if [ ! -f build/national/index.json ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Le dernier calcul complet est déjà publié.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from update_arome_ifs import validate_product
          validate_product(Path('build/national'))
          PY
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Publier la branche data
        if: steps.validate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          source_dir="$PWD/build/national"
          publish_dir="$(mktemp -d)"
          git -C "$publish_dir" init -b data
          git -C "$publish_dir" remote add origin "https://github.com/$REPOSITORY.git"
          git -C "$publish_dir" config credential.helper "!f() { if [ \"\$1\" = get ]; then echo username=x-access-token; echo password=\$GH_TOKEN; fi; }; f"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            if git ls-remote --exit-code --heads "https://github.com/$REPOSITORY.git" data >/dev/null; then
              git -C "$publish_dir" fetch --depth=1 origin data
              git -C "$publish_dir" reset --hard FETCH_HEAD
              decision="$(python - "$source_dir/index.json" "$publish_dir/index.json" <<'PY'
          import json, sys
          source = json.load(open(sys.argv[1], encoding='utf-8'))['model']
          remote = json.load(open(sys.argv[2], encoding='utf-8'))['model']
          source_key = (source['run_time'], source.get('pipeline_version', ''))
          remote_key = (remote['run_time'], remote.get('pipeline_version', ''))
          print('skip' if remote_key >= source_key else 'publish')
          PY
              )"
              if [ "$decision" = 'skip' ]; then
                echo 'Une publication identique ou plus récente est déjà présente : elle est conservée.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              git -C "$publish_dir" rm -r --ignore-unmatch .
            fi
            cp -a "$source_dir/." "$publish_dir/"
            touch "$publish_dir/.nojekyll"
            git -C "$publish_dir" add --all
            git -C "$publish_dir" commit -m "Prévisions AROME-IFS $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git -C "$publish_dir" push origin HEAD:data; then
              echo "Prévisions publiées dans https://github.com/$REPOSITORY/tree/data" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "La branche data a changé pendant la publication ; nouvelle tentative $attempt/4."
            sleep $((attempt * 2))
          done
          echo 'Échec après quatre tentatives concurrentes.' >&2
          exit 1
      - name: Préparer le ZIP WordPress
        run: |
          mkdir -p build/zip
          cd wordpress
          zip -qr ../build/zip/arome-ifs-2-5-km-wordpress.zip arome-ifs-2-5-km
      - uses: actions/upload-artifact@v4
        with:
          name: arome-ifs-2-5-km-wordpress
          path: build/zip/arome-ifs-2-5-km-wordpress.zip
          if-no-files-found: error

